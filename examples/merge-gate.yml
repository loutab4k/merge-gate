# Copy to .github/workflows/merge-gate.yml and set `workflows:` to the name of the project's CI workflow.
name: merge-gate

on:
  # Deliberate: the gate runs no PR code; see the threat model in the README.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [ci]
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: merge-gate-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  gate:
    uses: loutab4k/merge-gate/.github/workflows/gate.yml@v1
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
