name: merge-gate

on:
  workflow_call:
    inputs:
      model:
        type: string
        default: claude-opus-5-5
      runner:
        description: Runner label for every job; on a self-hosted runner, one that never runs PR code
        type: string
        default: ubuntu-24.04
    secrets:
      claude_code_oauth_token:
        required: false

# Every job checks out the gate code at the commit the caller's `uses:` resolved to
# (job.workflow_repository and job.workflow_sha), runs Python with -s -E so no user site or
# PYTHON* variable can inject code, and uses a fresh HOME, so files left in the runner user's home
# (~/.local, ~/.claude) cannot run here. A process left on a shared runner still could: use a
# runner that never runs PR code. Each step that does the work has its own short timeout; the job
# timeout only bounds the runner's own setup.
jobs:
  assess:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
    outputs:
      skip: ${{ steps.assess.outputs.skip }}
      needs_review: ${{ steps.assess.outputs.needs_review }}
    steps:
      - name: Gate identity and a fresh HOME
        env:
          GATE_REPO: ${{ job.workflow_repository }}
          GATE_SHA: ${{ job.workflow_sha }}
        run: test -n "$GATE_REPO" && test -n "$GATE_SHA" && mkdir "$RUNNER_TEMP/home" && echo "HOME=$RUNNER_TEMP/home" >> "$GITHUB_ENV"
      # The config comes from the default branch, so a PR cannot change the rules it is judged by.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: base
          persist-credentials: false
          sparse-checkout: .github/merge-gate.json
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .merge-gate
          persist-credentials: false
      - id: assess
        timeout-minutes: 10
        working-directory: .merge-gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MERGE_GATE_CONFIG: ${{ github.workspace }}/base/.github/merge-gate.json
        run: python3 -s -E -m merge_gate assess "$RUNNER_TEMP/merge-gate-input"
      - if: steps.assess.outputs.skip == 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: merge-gate-input
          path: ${{ runner.temp }}/merge-gate-input
          retention-days: 7

  review:
    needs: assess
    if: needs.assess.outputs.needs_review == 'true'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
    outputs:
      review_json: ${{ steps.claude.outputs.structured_output }}
    steps:
      - name: Gate identity and a fresh HOME
        env:
          GATE_REPO: ${{ job.workflow_repository }}
          GATE_SHA: ${{ job.workflow_sha }}
        run: test -n "$GATE_REPO" && test -n "$GATE_SHA" && mkdir "$RUNNER_TEMP/home" && echo "HOME=$RUNNER_TEMP/home" >> "$GITHUB_ENV"
      # The default branch sits at the root; PR code is only read, from pr-head, never run. Claude
      # loads skills, commands and agents from pr-head/.claude (--add-dir), so assess never sends a
      # PR that edits agent config here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: pr-head
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .merge-gate
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: merge-gate-input
          path: .merge-gate-input
      - id: prompt
        working-directory: .merge-gate
        run: python3 -s -E -m merge_gate.prompt >> "$GITHUB_OUTPUT"
      - id: bun
        timeout-minutes: 5
        working-directory: .merge-gate
        run: python3 -s -E -m merge_gate.bun "$RUNNER_TEMP/bun" >> "$GITHUB_OUTPUT"
      # dontAsk denies every call that would need approval: reads outside the working directory
      # and pr-head (such as /proc or the runner's files) and all tools but Read, Grep and Glob.
      - id: claude
        timeout-minutes: 30
        uses: anthropics/claude-code-action@925afb53776cf1a2b738c6bdbed37b4d4000ef13 # v1.0.262
        with:
          claude_code_oauth_token: ${{ secrets.claude_code_oauth_token }}
          github_token: ${{ github.token }}
          allowed_bots: dependabot[bot],renovate[bot]
          path_to_bun_executable: ${{ steps.bun.outputs.path }}
          prompt: ${{ steps.prompt.outputs.prompt }}
          claude_args: >-
            --model ${{ inputs.model }}
            --effort high
            --permission-mode dontAsk
            --add-dir pr-head
            --disallowedTools Bash,Edit,Write,NotebookEdit,WebFetch,WebSearch,Task,Read(./.git),Read(./.git/**),Read(./pr-head/.git),Read(./pr-head/.git/**)
            --json-schema '${{ steps.prompt.outputs.schema }}'

  report:
    needs: [assess, review]
    if: ${{ !cancelled() && needs.assess.result == 'success' && needs.assess.outputs.skip == 'false' }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Gate identity and a fresh HOME
        env:
          GATE_REPO: ${{ job.workflow_repository }}
          GATE_SHA: ${{ job.workflow_sha }}
        run: test -n "$GATE_REPO" && test -n "$GATE_SHA" && mkdir "$RUNNER_TEMP/home" && echo "HOME=$RUNNER_TEMP/home" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .merge-gate
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: merge-gate-input
          path: ${{ runner.temp }}/merge-gate-input
      - timeout-minutes: 10
        working-directory: .merge-gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REVIEW_JSON: ${{ needs.review.outputs.review_json }}
        run: python3 -s -E -m merge_gate report "$RUNNER_TEMP/merge-gate-input"
