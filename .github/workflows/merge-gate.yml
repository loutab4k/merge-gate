name: merge-gate

on:
  # Deliberate: the gate runs no PR code; see the threat model in the README.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [test]
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: merge-gate-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  gate:
    uses: ./.github/workflows/gate.yml
    with:
      gate_ref: main
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
