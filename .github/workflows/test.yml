name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A venv: the runner's system Python refuses pip installs (PEP 668).
      - run: python3 -m venv "$RUNNER_TEMP/venv"
      - run: '"$RUNNER_TEMP/venv/bin/pip" install --quiet -r requirements-dev.txt'
      - run: '"$RUNNER_TEMP/venv/bin/python" -m pytest -q'
